<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>✨ Happy Diwali - Real Cracker Sounds</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #02020a; overflow: hidden; overflow-x: hidden; font-family: 'Poppins', sans-serif; color: #fff; height: 100vh; width: 100vw; }
    #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #landing {
      position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 25%, #1a0a2e 0%, #0a0618 45%, #02020a 100%);
      transition: opacity 1.5s ease, visibility 1.5s;
    }
    #landing.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .diya-row { display: flex; gap: 30px; margin-bottom: 26px; animation: float 3.2s ease-in-out infinite; }
    .diya { font-size: 50px; filter: drop-shadow(0 0 16px #ff9800); animation: flicker 1.3s ease-in-out infinite alternate; }
    .diya:nth-child(2) { animation-delay: 0.22s; }
    .diya:nth-child(3) { animation-delay: 0.45s; }
    @keyframes flicker {
      0%   { filter: drop-shadow(0 0 8px #ff8f00) brightness(0.82); transform: scale(0.96); }
      100% { filter: drop-shadow(0 0 24px #ffc107) brightness(1.28); transform: scale(1.07); }
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    h1.main-title {
      font-family: 'Great Vibes', cursive; font-size: clamp(2.9rem, 9vw, 5.3rem);
      background: linear-gradient(90deg, #ff9800, #ffeb3b, #ff5722, #ff9800); background-size: 300% 100%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: shine 4s linear infinite; text-align: center; margin-bottom: 6px;
    }
    @keyframes shine { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
    .subtitle { font-size: 1.05rem; color: #ffcc80; margin-bottom: 36px; letter-spacing: 2.5px; opacity: 0.9; }
    .input-box { display: flex; flex-direction: column; align-items: center; gap: 16px; width: min(90%, 380px); }
    input[type="text"] {
      width: 100%; padding: 16px 22px; font-size: 1.15rem; border: 2px solid #ff9800; border-radius: 50px;
      background: rgba(255,152,0,0.07); color: #fff; text-align: center; outline: none; transition: all 0.3s;
      font-family: 'Poppins', sans-serif;
    }
    input[type="text"]::placeholder { color: #ffb74d77; }
    input[type="text"]:focus { border-color: #ffeb3b; box-shadow: 0 0 30px rgba(255,193,7,0.5); background: rgba(255,152,0,0.14); }
    .btn {
      padding: 15px 42px; font-size: 1.12rem; font-weight: 600; border: none; border-radius: 50px; cursor: pointer;
      background: linear-gradient(135deg, #ff6f00, #ff9800, #ffc107); color: #1a0a00;
      box-shadow: 0 6px 28px rgba(255,152,0,0.5); transition: all 0.3s; letter-spacing: 1px;
    }
    .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 38px rgba(255,152,0,0.72); }
    .btn:active { transform: scale(0.97); }
    #wish-overlay {
      position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 1.9s ease;
      padding: 16px 16px 140px;
    }
    #wish-overlay.visible { opacity: 1; }
    .wish-text {
      font-family: 'Great Vibes', cursive; font-size: clamp(2.4rem, 10vw, 5.6rem); text-align: center; line-height: 1.15;
      background: linear-gradient(90deg, #ffeb3b, #ff9800, #ff5722, #e91e63, #ffeb3b); background-size: 300% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: shine 5s linear infinite; filter: drop-shadow(0 0 20px rgba(255,193,7,0.6)); padding: 0 12px;
      max-width: 100%;
    }
    .wish-name {
      font-family: 'Poppins', sans-serif; font-size: clamp(1.4rem, 5.5vw, 2.9rem); font-weight: 700; color: #fff;
      text-shadow: 0 0 18px #ff9800, 0 0 36px #ff5722, 0 0 10px #fff; margin-top: 8px; letter-spacing: 1.5px;
      padding: 0 12px; text-align: center; word-break: break-word; max-width: 100%;
    }
    .wish-sub {
      margin-top: 12px; font-size: clamp(0.85rem, 2.6vw, 1.2rem); color: #ffcc80; opacity: 0.88;
      text-align: center; max-width: min(90%, 420px); line-height: 1.4; padding: 0 8px;
    }

    /* Bottom UI bar */
    #bottomUI {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      background: linear-gradient(to top, rgba(2,2,10,0.75) 0%, rgba(2,2,10,0.35) 55%, transparent 100%);
    }
    #controls {
      display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap;
      opacity: 0; transition: opacity 1.2s; pointer-events: none;
    }
    #controls.visible { opacity: 1; pointer-events: auto; }
    .ctrl-btn {
      width: 48px; height: 48px; min-width: 48px; border-radius: 50%; border: 2px solid rgba(255,152,0,0.55);
      background: rgba(12,6,20,0.88); color: #ffc107; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.25s;
      backdrop-filter: blur(10px); -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    .ctrl-btn:hover { background: rgba(255,152,0,0.25); transform: scale(1.08); box-shadow: 0 0 22px rgba(255,152,0,0.6); }
    .ctrl-btn:active { transform: scale(0.96); }
    #shareBtn.ctrl-btn {
      width: auto !important; min-width: auto; padding: 0 16px !important; border-radius: 28px !important;
      font-size: 0.88rem !important; font-weight: 600; height: 48px;
    }
    .hint {
      font-size: 0.78rem; color: #ffb74d88; opacity: 0; transition: opacity 1.2s;
      text-align: center; padding: 0 10px; line-height: 1.3;
    }
    .hint.visible { opacity: 1; }
    #statsBar {
      display: flex; gap: 16px; font-size: 0.72rem; color: #ffb74d99;
      white-space: nowrap; pointer-events: none; letter-spacing: 0.2px;
    }
    #statsBar span { display: inline-flex; align-items: center; gap: 4px; }

    /* Share modal responsive */
    #shareModal {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.78); align-items: center; justify-content: center;
      padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    #shareModal .modal-card {
      background: linear-gradient(145deg,#1a0a2e,#0d0618); border: 2px solid #ff9800;
      border-radius: 20px; padding: 24px 20px; width: min(100%, 360px);
      text-align: center; box-shadow: 0 0 40px rgba(255,152,0,0.35);
      margin: auto;
    }
    #shareModal button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    #shareModal input {
      font-size: 16px !important; /* prevents iOS zoom on focus */
    }

    @media (min-width: 768px) {
      .ctrl-btn { width: 54px; height: 54px; min-width: 54px; font-size: 22px; }
      #shareBtn.ctrl-btn { height: 54px; padding: 0 20px !important; font-size: 0.95rem !important; }
      #controls { gap: 14px; }
      .hint { font-size: 0.85rem; }
      #statsBar { font-size: 0.8rem; gap: 20px; }
      #wish-overlay { padding-bottom: 150px; }
    }

    .hanging-lights .light:nth-child(n+12) { display: none; }
    @media (max-width: 380px) {
      .hanging-lights .light:nth-child(n+8) { display: none; }
      .ctrl-btn { width: 44px; height: 44px; min-width: 44px; font-size: 18px; }
      #shareBtn.ctrl-btn { height: 44px; padding: 0 12px !important; font-size: 0.8rem !important; }
      #controls { gap: 8px; }
      #statsBar { font-size: 0.68rem; gap: 12px; }
      .hint { font-size: 0.7rem; }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      #wish-overlay { padding-bottom: 90px; justify-content: flex-start; padding-top: 12%; }
      .wish-text { font-size: clamp(1.8rem, 8vw, 3rem); }
      .wish-name { font-size: clamp(1.1rem, 4vw, 1.8rem); }
      .wish-sub { display: none; }
      #bottomUI { padding-top: 6px; gap: 4px; }
      .hint { display: none; }
    }
    .hanging-lights {
      overflow: hidden;
      position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 40; pointer-events: none;
      display: flex; justify-content: space-around; padding: 0 6px; opacity: 0; transition: opacity 1.9s;
    }
    .hanging-lights.visible { opacity: 1; }
    .light {
      width: 11px; height: 16px; border-radius: 50% 50% 40% 40%; margin-top: 22px; position: relative;
      animation: lightBlink 1.6s ease-in-out infinite alternate;
    }
    .light::before {
      content: ''; position: absolute; top: -22px; left: 50%; width: 1.5px; height: 22px;
      background: #3a3a3a; transform: translateX(-50%);
    }
    .light:nth-child(odd)  { background: #ff5722; box-shadow: 0 0 14px #ff5722; animation-delay: 0.12s; }
    .light:nth-child(even) { background: #ffeb3b; box-shadow: 0 0 14px #ffeb3b; animation-delay: 0.35s; }
    .light:nth-child(3n)   { background: #e91e63; box-shadow: 0 0 14px #e91e63; animation-delay: 0.6s; }
    .light:nth-child(4n)   { background: #4caf50; box-shadow: 0 0 14px #4caf50; animation-delay: 0.9s; }
    .light:nth-child(5n)   { background: #2196f3; box-shadow: 0 0 14px #2196f3; animation-delay: 0.48s; }
    @keyframes lightBlink { 0% { opacity: 0.4; transform: scale(0.86); } 100% { opacity: 1; transform: scale(1.14); } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="hanging-lights" id="hangingLights" class="visible">
    <div class="light"></div><div class="light"></div><div class="light"></div>
    <div class="light"></div><div class="light"></div><div class="light"></div>
    <div class="light"></div><div class="light"></div><div class="light"></div>
    <div class="light"></div><div class="light"></div><div class="light"></div>
    <div class="light"></div><div class="light"></div><div class="light"></div>
    <div class="light"></div>
  </div>
  <div id="landing" class="hidden" style="display:none !important">
    <div class="diya-row"><span class="diya">🪔</span><span class="diya">🪔</span><span class="diya">🪔</span></div>
    <h1 class="main-title">Happy Diwali</h1>
    <p class="subtitle">Festival of Lights & Crackers</p>
    <div class="input-box">
      <input type="text" id="nameInput" placeholder="Enter your name..." maxlength="25" autocomplete="off" />
      <button class="btn" id="startBtn">✨ Light the Crackers!</button>
    </div>
  </div>
  <div id="wish-overlay" class="visible">
    <div class="wish-text">Happy Diwali</div>
    <div class="wish-name" id="displayName"></div>
    <div class="wish-sub">May your life sparkle with joy, light & prosperity ✨</div>
  </div>
  <div id="bottomUI">
<div id="controls" class="visible">
    <button class="ctrl-btn" id="soundBtn" title="Toggle Sound">🔊</button>
    <button class="ctrl-btn" id="boomBtn" title="Grand Burst">💥</button>
    <button class="ctrl-btn" id="shareBtn" title="Send Wish">Send Wish</button>
  </div>
  <div class="hint" id="hint" class="visible">Click / Tap anywhere • Spacebar for big burst</div>
  <div id="statsBar">
    <span>👁️ <span id="viewCount">—</span> views</span>
    <span>📤 <span id="shareCount">—</span> shares</span>
  </div>
  </div>


  <!-- Share Modal -->
  <div id="shareModal">
    <div class="modal-card">
      <div style="font-size:2rem; margin-bottom:8px;">🪔</div>
      <div style="font-size:1.15rem; font-weight:600; color:#ffc107; margin-bottom:6px;">Send Diwali Wish</div>

      <div id="shareStep1">
        <div style="font-size:0.85rem; color:#ffcc80; margin-bottom:18px; opacity:0.9;">Choose wish type</div>
        <button id="btnCommonWish" style="width:100%; padding:14px; margin-bottom:12px; border:2px solid #ff9800; border-radius:14px; background:rgba(255,152,0,0.12); color:#ffc107; font-weight:600; font-size:1rem; cursor:pointer;">✨ Common Wish</button>
        <button id="btnPersonalWish" style="width:100%; padding:14px; margin-bottom:8px; border:2px solid #e91e63; border-radius:14px; background:rgba(233,30,99,0.12); color:#ff80ab; font-weight:600; font-size:1rem; cursor:pointer;">💝 Personalised Wish</button>
      </div>

      <div id="shareStep2" style="display:none;">
        <div style="font-size:0.85rem; color:#ffcc80; margin-bottom:12px; opacity:0.9;">Enter name for personalised wish</div>
        <input type="text" id="shareNameInput" placeholder="Friend's name..." maxlength="25"
          style="width:100%; padding:12px 16px; font-size:1rem; border:2px solid #ff9800; border-radius:40px; background:rgba(255,152,0,0.08); color:#fff; text-align:center; outline:none; margin-bottom:16px; font-family:Poppins,sans-serif;" />
        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
          <button id="shareWhatsApp" style="padding:10px 18px; border:none; border-radius:30px; background:#25D366; color:#fff; font-weight:600; cursor:pointer; font-size:0.9rem;">WhatsApp</button>
          <button id="shareCopy" style="padding:10px 18px; border:none; border-radius:30px; background:#ff9800; color:#1a0a00; font-weight:600; cursor:pointer; font-size:0.9rem;">Copy Link</button>
          <button id="shareNative" style="padding:10px 18px; border:none; border-radius:30px; background:#e91e63; color:#fff; font-weight:600; cursor:pointer; font-size:0.9rem;">Share</button>
        </div>
        <button id="shareBack" style="margin-top:12px; background:none; border:none; color:#ffb74d99; cursor:pointer; font-size:0.85rem;">← Back</button>
      </div>

      <div id="shareStepCommon" style="display:none;">
        <div style="font-size:0.85rem; color:#ffcc80; margin-bottom:14px; opacity:0.9;">Send a common Diwali wish</div>
        <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
          <button id="shareWhatsAppCommon" style="padding:10px 18px; border:none; border-radius:30px; background:#25D366; color:#fff; font-weight:600; cursor:pointer; font-size:0.9rem;">WhatsApp</button>
          <button id="shareCopyCommon" style="padding:10px 18px; border:none; border-radius:30px; background:#ff9800; color:#1a0a00; font-weight:600; cursor:pointer; font-size:0.9rem;">Copy Link</button>
          <button id="shareNativeCommon" style="padding:10px 18px; border:none; border-radius:30px; background:#e91e63; color:#fff; font-weight:600; cursor:pointer; font-size:0.9rem;">Share</button>
        </div>
        <button id="shareBackCommon" style="margin-top:12px; background:none; border:none; color:#ffb74d99; cursor:pointer; font-size:0.85rem;">← Back</button>
      </div>

      <button id="shareClose" style="margin-top:14px; background:none; border:none; color:#ffb74d99; cursor:pointer; font-size:0.85rem;">Cancel</button>
      <div id="shareStatus" style="margin-top:10px; font-size:0.8rem; color:#4caf50; min-height:18px;"></div>
    </div>
  </div>

function makePool(dataUri, count, volume) {
  const pool = [];
  for (let i = 0; i < count; i++) {
    const a = new Audio(dataUri);
    a.volume = volume;
    a.preload = 'auto';
    pool.push(a);
  }
  return pool;
}

  // Launch sounds
  launchPool.push(...makePool(EMBEDDED_SOUNDS.whistle_short, 4, 0.62));
  launchPool.push(...makePool(EMBEDDED_SOUNDS.launch_clip, 4, 0.52));
  // Explosion sounds
  explodePool.push(...makePool(EMBEDDED_SOUNDS.explode_whistle, 4, 0.58));
  explodePool.push(...makePool(EMBEDDED_SOUNDS.explode_boom, 5, 0.50));
}

function playFromPool(pool, volScale = 1) {
  if (!soundEnabled || !pool.length) return;
  unlockAudio();
  let s = pool.find(a => a.paused || a.ended || a.currentTime === 0);
  if (!s) {
    s = pool[Math.floor(Math.random() * pool.length)].cloneNode();
    s.volume = pool[0].volume;
  }
  try {
    s.currentTime = 0;
    s.playbackRate = 0.88 + Math.random() * 0.28;
    s.volume = Math.min(1, (s.volume || 0.5) * volScale);
    const p = s.play();
    if (p) p.catch(() => {});
  } catch (e) {}
}

function playLaunchSound() {
  playFromPool(launchPool, 0.75 + Math.random() * 0.2);
}

function playExplosionSound(size = 1) {
  // Different character based on size + random variety
  const r = Math.random();
  if (size > 1.1 || r > 0.65) {
    // Bigger / richer boom
    playFromPool(explodePool.filter((_,i)=>i%2===1), 0.7 + size * 0.28); // boom clips
    if (Math.random() > 0.5) playFromPool(explodePool.filter((_,i)=>i%2===0), 0.4); // layer whistle
  } else if (r > 0.35) {
    // Sharp whistle-crack
    playFromPool(explodePool.filter((_,i)=>i%2===0), 0.68 + size * 0.25);
  } else {
    // Mixed / softer
    playFromPool(explodePool, 0.58 + size * 0.25);
  }
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [], rockets = [], stars = [], flashes = [], smokes = [];
let wind = 0, windTarget = 0, shakeX = 0, shakeY = 0;
let animationStarted = false, autoLaunch = true, frame = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  createStars();
}
window.addEventListener('resize', resize);
resize();

function createStars() {
  stars = [];
  const count = Math.floor((W * H) / 15000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H * 0.7,
      size: Math.random() * 1.6 + 0.2, alpha: Math.random() * 0.55 + 0.1,
      twinkle: Math.random() * Math.PI * 2, speed: 0.012 + Math.random() * 0.03
    });
  }
}

class Particle {
  constructor(x, y, color, vx, vy, options = {}) {
    this.x = x; this.y = y; this.color = color; this.vx = vx; this.vy = vy;
    this.mass = options.mass ?? (0.7 + Math.random() * 0.8);
    this.gravity = (options.gravity ?? 0.078) * this.mass;
    this.drag = options.drag ?? (0.008 + Math.random() * 0.007);
    this.life = options.life ?? 70; this.maxLife = this.life;
    this.size = options.size ?? (Math.random() * 2.4 + 0.6); this.baseSize = this.size;
    this.alpha = 1; this.sparkle = options.sparkle || false; this.ember = options.ember || false;
    this.flickerSpeed = 0.18 + Math.random() * 0.45; this.flickerPhase = Math.random() * Math.PI * 2;
    this.trail = options.trail ? [] : null;
  }
  update(windForce) {
    const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (speed > 0.01) {
      const dragForce = this.drag * speed * speed;
      this.vx -= (this.vx / speed) * dragForce;
      this.vy -= (this.vy / speed) * dragForce;
    }
    this.vx += windForce * (1.1 - this.mass * 0.4) * 0.035;
    this.vy += this.gravity;
    this.x += this.vx; this.y += this.vy;
    if (this.trail) { this.trail.push({x:this.x,y:this.y}); if (this.trail.length > 6) this.trail.shift(); }
    this.life--;
    const lifeRatio = this.life / this.maxLife;
    this.alpha = Math.max(0, lifeRatio);
    this.size = this.baseSize * (this.ember ? (0.5 + lifeRatio * 0.5) : (0.35 + lifeRatio * 0.65));
    this.flickerPhase += this.flickerSpeed;
  }
  draw() {
    if (this.alpha <= 0.02) return;
    let a = this.alpha;
    if (this.sparkle || this.ember) a *= 0.5 + 0.5 * Math.abs(Math.sin(this.flickerPhase));
    if (this.trail && this.trail.length > 1) {
      for (let i = 0; i < this.trail.length; i++) {
        const t = this.trail[i];
        ctx.globalAlpha = (i / this.trail.length) * a * 0.4;
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(t.x, t.y, this.size * 0.45, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.save();
    ctx.globalAlpha = a;
    const glowSize = this.size * (this.ember ? 5.5 : 4.2);
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
    g.addColorStop(0, this.color); g.addColorStop(0.3, this.color); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = a * 0.92; ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    if (a > 0.3) {
      ctx.globalAlpha = a * 0.7; ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 0.28, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

class Smoke {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 0.6; this.vy = -0.3 - Math.random() * 0.5;
    this.life = 40 + Math.random() * 30; this.maxLife = this.life;
    this.size = 8 + Math.random() * 14;
  }
  update(windForce) {
    this.x += this.vx + windForce * 0.08; this.y += this.vy;
    this.vy *= 0.99; this.size *= 1.015; this.life--;
  }
  draw() {
    const a = (this.life / this.maxLife) * 0.09;
    if (a <= 0.005) return;
    ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    g.addColorStop(0, 'rgba(180,160,140,0.5)'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

class Rocket {
  constructor(x, targetY, type = 'random') {
    this.x = x; this.y = H + 14; this.targetY = targetY;
    this.vy = -(Math.random() * 3.5 + 11.2); this.vx = (Math.random() - 0.5) * 1.7;
    this.hue = Math.random() * 360;
    this.type = type === 'random'
      ? ['peony','chrysanthemum','willow','ring','crossette','palm','strobe'][Math.floor(Math.random()*7)]
      : type;
    this.trail = []; this.exploded = false; this.age = 0;
  }
  update(windForce) {
    if (this.exploded) return;
    this.age++;
    this.trail.push({x: this.x, y: this.y});
    if (this.trail.length > 22) this.trail.shift();
    this.x += this.vx + windForce * 0.04;
    this.y += this.vy; this.vy += 0.115;
    this.vx += (Math.random() - 0.5) * 0.07;
    if (this.age % 3 === 0 && Math.random() > 0.4) {
      smokes.push(new Smoke(this.x + (Math.random()-0.5)*4, this.y + 6));
    }
    if (this.vy >= -1.0 || this.y <= this.targetY) this.explode();
  }
  explode() {
    this.exploded = true;
    const size = 0.82 + Math.random() * 0.48;
    playExplosionSound(size);
    if (size > 1.05) {
      shakeX = (Math.random()-0.5)*7; shakeY = (Math.random()-0.5)*5;
      flashes.push({life:14, max:14});
    } else if (size > 0.95) {
      shakeX = (Math.random()-0.5)*3.5; shakeY = (Math.random()-0.5)*2.5;
    }
    for (let i = 0; i < 5; i++) {
      smokes.push(new Smoke(this.x+(Math.random()-0.5)*25, this.y+(Math.random()-0.5)*20));
    }
    const baseHue = this.hue;
    if (this.type === 'peony' || this.type === 'chrysanthemum') {
      const count = 110 + Math.floor(Math.random()*50);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI*2*i)/count + (Math.random()-0.5)*0.5;
        const speed = (Math.random()*6+3)*size;
        particles.push(new Particle(this.x, this.y, this.pickColor(baseHue),
          Math.cos(angle)*speed, Math.sin(angle)*speed, {
            gravity: 0.06+Math.random()*0.035, drag: 0.01+Math.random()*0.012,
            life: 58+Math.random()*48, sparkle: Math.random()>0.65,
            mass: 0.6+Math.random()*0.7, trail: Math.random()>0.85
          }));
      }
      setTimeout(() => {
        for (let i = 0; i < 35; i++) {
          const angle = Math.random()*Math.PI*2, speed = Math.random()*2.6+0.5;
          particles.push(new Particle(this.x+(Math.random()-0.5)*45, this.y+(Math.random()-0.5)*45, '#fff3e0',
            Math.cos(angle)*speed, Math.sin(angle)*speed,
            {gravity:0.04, drag:0.014, life:30+Math.random()*25, size:1.2, sparkle:true, mass:0.5}));
        }
        for (let i = 0; i < 12; i++) {
          particles.push(new Particle(this.x+(Math.random()-0.5)*60, this.y+(Math.random()-0.5)*40,
            `hsl(${25+Math.random()*25},100%,${50+Math.random()*20}%)`,
            (Math.random()-0.5)*1.2, Math.random()*0.8-0.3,
            {gravity:0.028, drag:0.02, life:90+Math.random()*60, size:1.6, ember:true, sparkle:true, mass:0.9}));
        }
      }, 60+Math.random()*90);
    } else if (this.type === 'willow') {
      const count = 80 + Math.floor(Math.random()*35);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI*2*i)/count + (Math.random()-0.5)*0.6;
        const speed = (Math.random()*3.5+2.1)*size;
        particles.push(new Particle(this.x, this.y, this.pickColor(baseHue, true),
          Math.cos(angle)*speed*0.6, Math.sin(angle)*speed*0.4-1.9, {
            gravity: 0.085+Math.random()*0.035, drag: 0.006, life: 100+Math.random()*55,
            size: 1.5+Math.random(), sparkle: Math.random()>0.55, mass: 0.5+Math.random()*0.5, trail: true
          }));
      }
    } else if (this.type === 'ring') {
      const count = 64, speed = (6+Math.random()*1.5)*size;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI*2*i)/count;
        particles.push(new Particle(this.x, this.y, this.pickColor(baseHue),
          Math.cos(angle)*speed, Math.sin(angle)*speed,
          {gravity:0.048, drag:0.009, life:50+Math.random()*30, size:2.15, mass:0.75}));
      }
    } else if (this.type === 'crossette') {
      const arms = 6 + Math.floor(Math.random()*3);
      for (let a = 0; a < arms; a++) {
        const baseAngle = (Math.PI*2*a)/arms;
        for (let j = 0; j < 10; j++) {
          const angle = baseAngle + (Math.random()-0.5)*0.2;
          const speed = (3+j*0.72)*size;
          particles.push(new Particle(this.x, this.y, this.pickColor(baseHue),
            Math.cos(angle)*speed, Math.sin(angle)*speed,
            {gravity:0.065, drag:0.008, life:44+Math.random()*30, sparkle:j>6, mass:0.7, trail:j>7}));
        }
      }
    } else if (this.type === 'palm') {
      const count = 60 + Math.floor(Math.random()*25);
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI/2 + (Math.random()-0.5)*1.9;
        const speed = (Math.random()*4.6+3.4)*size;
        particles.push(new Particle(this.x, this.y, this.pickColor(baseHue, true),
          Math.cos(angle)*speed*0.65, Math.sin(angle)*speed, {
            gravity: 0.095+Math.random()*0.03, drag: 0.007, life: 85+Math.random()*40,
            size: 1.35+Math.random()*0.9, sparkle: true, mass: 0.55+Math.random()*0.4, trail: true
          }));
      }
    } else if (this.type === 'strobe') {
      const count = 70 + Math.floor(Math.random()*30);
      for (let i = 0; i < count; i++) {
        const angle = Math.random()*Math.PI*2;
        const speed = (Math.random()*4.5+2.5)*size;
        particles.push(new Particle(this.x, this.y, Math.random()>0.3 ? '#ffffff' : this.pickColor(baseHue),
          Math.cos(angle)*speed, Math.sin(angle)*speed, {
            gravity: 0.055, drag: 0.011, life: 40+Math.random()*35,
            size: 1.8+Math.random(), sparkle: true, mass: 0.65, trail: Math.random()>0.6
          }));
      }
    }
    for (let i = 0; i < 16; i++) {
      const angle = Math.random()*Math.PI*2, speed = Math.random()*4.8+1.3;
      particles.push(new Particle(this.x, this.y, '#ffffff',
        Math.cos(angle)*speed, Math.sin(angle)*speed,
        {gravity:0.05, drag:0.012, life:16+Math.random()*18, size:2, sparkle:true, mass:0.5, trail:true}));
    }
  }
  pickColor(baseHue, preferGold = false) {
    const r = Math.random();
    if (preferGold || r < 0.2) return `hsl(${26+Math.random()*30},100%,${50+Math.random()*30}%)`;
    if (r < 0.38) return `hsl(${baseHue},100%,${48+Math.random()*32}%)`;
    if (r < 0.52) return `hsl(${(baseHue+35)%360},100%,62%)`;
    if (r < 0.66) return `hsl(${Math.random()*28},100%,55%)`;
    if (r < 0.78) return `hsl(${275+Math.random()*45},100%,65%)`;
    if (r < 0.88) return `hsl(${115+Math.random()*40},100%,55%)`;
    return '#fff8e1';
  }
  draw() {
    if (this.exploded) return;
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i], progress = i / this.trail.length;
      ctx.beginPath(); ctx.arc(t.x, t.y, progress*3.4, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${this.hue},100%,68%,${progress*0.48})`; ctx.fill();
    }
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 12);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.22, `hsl(${this.hue},100%,72%)`); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(this.x, this.y, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(this.x, this.y, 2.5, 0, Math.PI*2); ctx.fill();
  }
}

function launchRocket(x = null, forcedType = null) {
  const startX = x !== null ? x : (Math.random()*W*0.76 + W*0.12);
  const targetY = Math.random()*H*0.38 + H*0.06;
  rockets.push(new Rocket(startX, targetY, forcedType || 'random'));
  playLaunchSound();
}
function launchBurst(count = 5) {
  for (let i = 0; i < count; i++) setTimeout(() => launchRocket(), i*140 + Math.random()*90);
}

function animate() {
  frame++;
  if (frame % 40 === 0) windTarget = (Math.random()-0.5)*1.8;
  wind += (windTarget - wind) * 0.02;
  shakeX *= 0.82; shakeY *= 0.82;
  ctx.save(); ctx.translate(shakeX, shakeY);
  ctx.fillStyle = 'rgba(2,2,10,0.2)'; ctx.fillRect(-10,-10,W+20,H+20);
  stars.forEach(s => {
    s.twinkle += s.speed;
    ctx.globalAlpha = s.alpha * (0.48 + 0.52*Math.sin(s.twinkle));
    ctx.fillStyle = '#e4e4ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  for (let i = flashes.length-1; i >= 0; i--) {
    const f = flashes[i]; f.life--;
    ctx.fillStyle = `rgba(255,235,190,${(f.life/f.max)*0.16})`;
    ctx.fillRect(-10,-10,W+20,H+20);
    if (f.life <= 0) flashes.splice(i,1);
  }
  for (let i = smokes.length-1; i >= 0; i--) {
    smokes[i].update(wind); smokes[i].draw();
    if (smokes[i].life <= 0) smokes.splice(i,1);
  }
  for (let i = rockets.length-1; i >= 0; i--) {
    rockets[i].update(wind); rockets[i].draw();
    if (rockets[i].exploded) rockets.splice(i,1);
  }
  for (let i = particles.length-1; i >= 0; i--) {
    particles[i].update(wind); particles[i].draw();
    if (particles[i].life <= 0 || particles[i].alpha <= 0.02) particles.splice(i,1);
  }
  ctx.restore();
  requestAnimationFrame(animate);
}

function startAutoLaunch() {
  setInterval(() => {
    if (autoLaunch && animationStarted) {
      launchRocket();
      if (Math.random() > 0.48) setTimeout(() => launchRocket(), 240+Math.random()*240);
      if (Math.random() > 0.75) {
        setTimeout(() => {
          const specials = ['willow','palm','crossette','ring','strobe'];
          launchRocket(null, specials[Math.floor(Math.random()*specials.length)]);
        }, 460);
      }
    }
  }, 760 + Math.random()*560);
}

async function doCopy(name) {

  try {
    await navigator.clipboard.writeText(full);
    if (shareStatus) shareStatus.textContent = '✓ Link copied!';
  incrementShareCount();
  } catch {
    const ta = document.createElement('textarea');
    ta.value = full; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    if (shareStatus) shareStatus.textContent = '✓ Link copied!';
  }
}

function formatCount(n) {
  n = Number(n) || 0;
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return String(n);
}

function setStat(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = formatCount(value);
}

async function hitCounter(key) {
  // Try free public counter API
  try {
    const res = await fetch('https://api.countapi.xyz/hit/' + COUNTER_NS + '/' + key);
    if (res.ok) {
      const data = await res.json();
      if (typeof data.value === 'number') {
        localStorage.setItem(key, String(data.value));
        return data.value;
      }
    }
  } catch (e) {}
  // Fallback: localStorage only
  let v = parseInt(localStorage.getItem(key) || '0', 10) + 1;
  localStorage.setItem(key, String(v));
  return v;
}

async function getCounter(key) {
  try {
    const res = await fetch('https://api.countapi.xyz/get/' + COUNTER_NS + '/' + key);
    if (res.ok) {
      const data = await res.json();
      if (typeof data.value === 'number') {
        localStorage.setItem(key, String(data.value));
        return data.value;
      }
    }
  } catch (e) {}
  return parseInt(localStorage.getItem(key) || '0', 10);
}

async function initCounters() {
  // Page view
  const views = await hitCounter(VIEW_KEY);
  setStat('viewCount', views);
  // Shares (read only here)
  const shares = await getCounter(SHARE_KEY);
  setStat('shareCount', shares);
}

async function incrementShareCount() {
  const shares = await hitCounter(SHARE_KEY);
  setStat('shareCount', shares);
}

// Init when page loads
initCounters();


// Auto-start immediately (no landing page)
(function autoStart() {
  const params = new URLSearchParams(window.location.search);
  const urlName = params.get('name');
  const name = (urlName && urlName.trim()) ? urlName.trim() : 'Friend';
  // Set name for display
  const nameEl = document.getElementById('displayName');
  if (nameEl) nameEl.textContent = name + '!';
  // Also keep hidden input in sync if it exists
  const inputEl = document.getElementById('nameInput');
  if (inputEl) inputEl.value = name;

  setTimeout(() => {
    if (!animationStarted) startCelebration();
  }, 300);
})();


// Landing page removed – no startBtn / nameInput listeners

function startCelebration() {
  unlockAudio();
  initEmbeddedSounds();

  const inputEl = document.getElementById('nameInput');
  const name = (inputEl && inputEl.value.trim()) ? inputEl.value.trim() : 'Friend';
  const nameEl = document.getElementById('displayName');
  if (nameEl) nameEl.textContent = name + '!';
  // landing already hidden
  animationStarted = true;

  // Play one sound immediately so user hears something right away
  setTimeout(() => playLaunchSound(), 100);

  setTimeout(() => {
    for (let i = 0; i < 8; i++) setTimeout(() => launchRocket(W*(0.1+i*0.115)), i*155);
  }, 280);
  setTimeout(() => launchRocket(W*0.5, 'willow'), 1450);
  setTimeout(() => launchRocket(W*0.32, 'palm'), 1850);
  setTimeout(() => launchRocket(W*0.68, 'strobe'), 2250);

  startAutoLaunch();
  animate();
}

canvas.addEventListener('click', e => { if (!animationStarted) return; launchRocket(e.clientX); });
canvas.addEventListener('touchstart', e => {
  if (!animationStarted) return;
  e.preventDefault();
  launchRocket(e.touches[0].clientX);
}, {passive:false});

const soundBtnEl = document.getElementById('soundBtn');
if (soundBtnEl) {
  soundBtnEl.addEventListener('click', (e) => {
    e.stopPropagation();
    soundEnabled = !soundEnabled;
    soundBtnEl.textContent = soundEnabled ? '🔊' : '🔇';
    soundBtnEl.title = soundEnabled ? 'Mute' : 'Unmute';
    // Stop any currently playing sounds when muting
    if (!soundEnabled) {
      [...launchPool, ...explodePool].forEach(a => {
        try { a.pause(); a.currentTime = 0; } catch (err) {}
      });
    }
  });
}
document.getElementById('boomBtn').addEventListener('click', () => launchBurst(6+Math.floor(Math.random()*3)));
document.addEventListener('keydown', e => {
  if (!animationStarted) return;
  if (e.code === 'Space') { e.preventDefault(); launchBurst(6); }
});
